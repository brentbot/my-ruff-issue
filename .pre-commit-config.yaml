# .pre-commit-config.yaml
# Run code-quality checks before every commit.

repos:
  # --------------------------------------------------
  # 1. Ruff — fast linter and formatter
  # --------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
