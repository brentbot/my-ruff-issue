[project]
name = "my-ruff-issue"
dynamic = ["version"]
authors = [
    {  name="Olivier Gauthé", email="olivier.gauthe@quobly.io"  },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.14.6",
    "pre-commit>=4.3.0",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool]
  [tool.hatch.version]
    path = "src/my_ruff_issue/__init__.py"

  [tool.ruff]
    line-length = 88

    [tool.ruff.lint]
      select        = ["C", "C90", "D209", "D403", "D405", "D413", "E", "EXE", "F", "I", "NPY", "RUF", "W"]
      extend-ignore = ["E501", "RUF012"]

      [tool.ruff.lint.isort]
        combine-as-imports = true

      [tool.ruff.lint.mccabe]
        max-complexity = 20

      [tool.ruff.lint.per-file-ignores]
        "__init__.py" = ["F401"]
