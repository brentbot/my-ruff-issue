name: Lint

on: [pull_request]

jobs:
  ruff-check:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    
    - name: Debug WSL/Docker detection
      run: |
        echo "=== /proc/sys/kernel/osrelease ==="
        cat /proc/sys/kernel/osrelease || echo "NOT FOUND"
        echo "=== /proc/version ==="
        cat /proc/version || echo "NOT FOUND"
        echo "=== /proc/self/cgroup ==="
        cat /proc/self/cgroup || echo "NOT FOUND"
        echo "=== /.dockerenv ==="
        ls -la /.dockerenv || echo "NOT FOUND"
        echo "=== /run/.containerenv ==="
        ls -la /run/.containerenv || echo "NOT FOUND"

    - name: install rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        . "$HOME/.cargo/env"

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: run ruff
      run: |
        uvx --from "git+https://github.com/brentbot/ruff@claude/investigate-wsl-detection-7SHeK" ruff check --select EXE .
