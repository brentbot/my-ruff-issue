name: Lint

on: [pull_request]

jobs:
  ruff-check:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    
    - name: Debug WSL/Docker detection
      run: |
        echo "=== /proc/sys/kernel/osrelease ==="
        cat /proc/sys/kernel/osrelease || echo "NOT FOUND"
        echo "=== /proc/version ==="
        cat /proc/version || echo "NOT FOUND"
        echo "=== /proc/self/cgroup ==="
        cat /proc/self/cgroup || echo "NOT FOUND"
        echo "=== /.dockerenv ==="
        ls -la /.dockerenv || echo "NOT FOUND"
        echo "=== /run/.containerenv ==="
        ls -la /run/.containerenv || echo "NOT FOUND"

    - name: check is_docker
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
        git clone https://github.com/TheLarkInn/is-docker
        cd is-docker
        cargo run --example main
