name: Lint

on: [pull_request]

jobs:
  ruff-check:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/ruff-action@v3
      with:
        args: check --target-version=py313

    - name: Run ruff-check again
      run: ruff check --config=pyproject.toml

    - name: Run ruff-check explicit rule
      run: ruff check --select=EXE001 --fix

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"

    - name: Install the project
      run: uv sync --locked --extra dev

    - name: ruff with uv
      run: uv run ruff check --fix

    - name: ruff from pre-commit
      run: uv run pre-commit run --all-files
